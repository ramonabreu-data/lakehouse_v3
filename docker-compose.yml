# Stack de Data Lakehouse: Dremio + Spark + MinIO + Nessie + PostgreSQL + MongoDB
#
# Whitelabel: nome do projeto, prefixo dos containers, prefixo dos volumes e nomes
# das zonas do object store vem todos do .env. Para implantar em outro cliente,
# edite o .env — este arquivo nao precisa ser tocado.

name: ${PROJETO}

services:
  dremio:
    platform: linux/amd64
    image: dremio/dremio-oss:26.0.5
    container_name: ${PROJETO}_dremio
    restart: unless-stopped
    ports:
      # UI/REST (9047) sai pelo proxy: https://dremio.${DOMAIN}. 45678 e interno.
      - "127.0.0.1:31010:31010"    # ODBC/JDBC legado (so loopback)
      - "127.0.0.1:32010:32010"    # Arrow Flight SQL (so loopback)
    environment:
      - DREMIO_JAVA_SERVER_EXTRA_OPTS=-Dpaths.dist=file:///opt/dremio/data/dist
      # Ajustado para host com pouca RAM livre. Aumente se sobrar memoria.
      - DREMIO_MAX_HEAP_MEMORY_SIZE_MB=2048
      - DREMIO_MAX_DIRECT_MEMORY_SIZE_MB=2048
    volumes:
      - dremio-data:/opt/dremio/data
    networks: [interna]

  spark:
    platform: linux/amd64
    # Imagem propria: base alexmerced/spark35nb + libs de ciencia de dados e ML.
    # Construir/reconstruir:  docker compose build spark
    build:
      context: ./docker/spark
    image: ${PROJETO}/spark-lakehouse:1.0
    container_name: ${PROJETO}_spark
    restart: unless-stopped
    ports:
      # Jupyter sai pelo proxy (jupyter.${DOMAIN}); o painel Streamlit tem
      # servico proprio (dashboard) e sai em dashboard.${DOMAIN}.
      # 7077 e so interno (spark://spark:7077). UIs do Spark ficam em loopback.
      - "127.0.0.1:8080:8080"              # Master Web UI
      - "127.0.0.1:8081:8081"              # Worker Web UI
      - "127.0.0.1:4040-4045:4040-4045"    # UI por job
      - "127.0.0.1:18080:18080"            # History Server
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - SPARK_MASTER_HOST=spark
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_WORKER_MEMORY=2g
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/tmp/spark-events
      - SPARK_HOME=/opt/spark
      - ZONA_ARMAZEM=${ZONA_ARMAZEM}
      - ZONA_ENTRADA=${ZONA_ENTRADA}
      - ZONA_HISTORICO=${ZONA_HISTORICO}
      - MINIO_ENDPOINT=http://minio:9000
      - NESSIE_URI=http://nessie:19120/api/v2
      # o modulo lakehouse.py fica em /workspace/notebooks
      - PYTHONPATH=/workspace/notebooks
      # Token do JupyterLab. Sem ele, a porta 8889 e execucao de codigo aberta.
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:?configure JUPYTER_TOKEN no .env}
    volumes:
      - ./seed/notebook-seed:/workspace/seed-data
      - ./streamlit_test_jupyter:/workspace/streamlit
      # bind mount: os notebooks-modelo ficam versionados no repositorio
      - ./notebooks:/workspace/notebooks
    # ATENCAO: cada comando em UMA linha. Em escalar YAML dobrado (>), linhas mais
    # indentadas que a primeira preservam a quebra de linha, e o bash trata o resto
    # como comando separado — as flags seguintes seriam engolidas em silencio.
    entrypoint: >
      /bin/bash -c "
      /opt/spark/sbin/start-master.sh &&
      /opt/spark/sbin/start-worker.sh spark://spark:7077 &&
      mkdir -p /tmp/spark-events &&
      start-history-server.sh &&
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token=$$JUPYTER_TOKEN --ServerApp.password='' --ServerApp.allow_origin='*' --ServerApp.trust_xheaders=True --ServerApp.root_dir=/workspace
      "
    depends_on: [minio, nessie]
    networks: [interna]

  # ---------------------------------------------------------------------------
  # Dashboard Streamlit. Servico proprio (mesma imagem do spark) para subir junto
  # com a stack, sem `docker compose exec` nem notebook manual. Separado do spark
  # para poder reiniciar/ver log do painel sem derrubar Jupyter e Spark.
  # ---------------------------------------------------------------------------
  dashboard:
    platform: linux/amd64
    # Mesma imagem do spark: ja tem streamlit, dremio-simple-query e o resto.
    build:
      context: ./docker/spark
    image: ${PROJETO}/spark-lakehouse:1.0
    container_name: ${PROJETO}_dashboard
    restart: unless-stopped
    working_dir: /workspace/streamlit
    environment:
      # O app tambem faz load_dotenv("vars.env"); estes sao os defaults da stack.
      - PYTHONUNBUFFERED=1
      - TZ=America/Fortaleza
      # O botao "Atualizar dados agora" publica a tarefa nesta fila.
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SUPABASE_URL=http://supabase-auth:9999
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./streamlit_test_jupyter:/workspace/streamlit
      # Carimbo da ultima atualizacao automatica (gravado pelo celery-worker).
      # Somente leitura: o painel le, quem escreve e o worker.
      - painel-estado:/estado:ro
    # 8501 nao e publicado no host: o acesso e por https://dashboard.${DOMAIN}.
    entrypoint: >
      /bin/bash -c "
      streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      dremio:
        condition: service_started
      redis:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
    networks: [interna]

  # ---------------------------------------------------------------------------
  # API de dados refinados. E a porta de saida do lakehouse para aplicacoes de
  # TERCEIROS: entrega em JSON as views curadas do space `refinamento`, com
  # contrato proprio (slug por conjunto), autenticacao, cache e limite de uso.
  #
  # Imagem propria e enxuta (python:3.12-slim, ~400 MB) em vez da do Spark:
  # a API so fala Arrow Flight com o Dremio. Ver docker/api/Dockerfile.
  #
  # O que ela publica esta em api/app/catalogo.py — nada fora dali e alcancavel.
  # ---------------------------------------------------------------------------
  api:
    platform: linux/amd64
    build:
      context: ./api
      dockerfile: ../docker/api/Dockerfile
      target: producao
    image: ${PROJETO}/api-dados:1.0
    container_name: ${PROJETO}_api
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Fortaleza
      # Conta de servico do Dremio. A MESMA do painel, mas declarada no .env em
      # vez de montar o vars.env: a API e o servico mais exposto da stack e nao
      # tem por que enxergar COOKIE_SECRET nem a senha do usuario master.
      - DREMIO_ENDPOINT=dremio:9047
      - DREMIO_FLIGHT_ENDPOINT=dremio:32010
      - DREMIO_USERNAME=${DREMIO_USERNAME:?configure DREMIO_USERNAME no .env}
      - DREMIO_PASSWORD=${DREMIO_PASSWORD:?configure DREMIO_PASSWORD no .env}
      # Quem pode chamar: chaves de aplicacao e/ou JWT do Supabase da stack.
      - API_AUTH_ATIVA=${API_AUTH_ATIVA:-true}
      - API_CHAVES=${API_CHAVES:-}
      - JWT_SECRET=${JWT_SECRET}
      # Origens liberadas para o navegador. `*` serve qualquer aplicacao web.
      - API_CORS_ORIGENS=${API_CORS_ORIGENS:-*}
      - API_CACHE_TTL=${API_CACHE_TTL:-300}
      - API_LIMITE_POR_MINUTO=${API_LIMITE_POR_MINUTO:-120}
      - API_TEMPO_LIMITE_CONSULTA=${API_TEMPO_LIMITE_CONSULTA:-60}
      # Banco 1 do Redis: o 0 e a fila do Celery.
      - API_REDIS_URL=redis://redis:6379/1
      - ARQUIVO_ESTADO=/estado/atualizacao.json
    volumes:
      # Carimbo da ultima carga, so leitura. Entra na chave do cache: dado novo
      # invalida as respostas guardadas na hora, sem esperar o TTL.
      - painel-estado:/estado:ro
    ports:
      # So loopback, para teste local (8000 costuma estar tomada por outro
      # projeto na maquina). O acesso externo e por https://api.${DOMAIN}.
      - "127.0.0.1:${API_PORTA_LOCAL:-8010}:8000"
    healthcheck:
      # A imagem slim nao tem curl; o proprio python resolve.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      dremio:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [interna]

  # ---------------------------------------------------------------------------
  # Atualizacao automatica do painel (Celery). Sobe junto com a stack: todo dia
  # as HORA_ATUALIZACAO (07:00, fuso America/Fortaleza) o worker refaz dataset
  # -> tabelas refinadas -> carimbo lido pelo dashboard. O botao "Atualizar
  # dados agora" da sidebar publica a MESMA tarefa nesta fila.
  # Ver celery_app/tarefas.py.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${PROJETO}_redis
    restart: unless-stopped
    # Fila efemera: sem RDB e sem AOF. Se o Redis reiniciar, o beat reagenda no
    # proximo tique — nao ha estado que valha a pena persistir aqui.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  celery-worker:
    platform: linux/amd64
    # Mesma imagem do spark: a tarefa sobe um driver Spark e roda o notebook.
    build:
      context: ./docker/spark
    image: ${PROJETO}/spark-lakehouse:1.0
    container_name: ${PROJETO}_celery_worker
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace:/workspace/notebooks
      - TZ=America/Fortaleza
      - CELERY_BROKER_URL=redis://redis:6379/0
      - HORA_ATUALIZACAO=${HORA_ATUALIZACAO:-07:00}
      # Mesmas credenciais do Spark: o refinamento le do MinIO e grava no Nessie.
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - NESSIE_URI=http://nessie:19120/api/v2
      - ZONA_ARMAZEM=${ZONA_ARMAZEM}
      - ZONA_ENTRADA=${ZONA_ENTRADA}
      - ZONA_HISTORICO=${ZONA_HISTORICO}
      # Varredura do ambiente: le o catalogo do Postgres direto do banco (o
      # Dremio so revalida o dele no ciclo de metadados, de 1h por padrao).
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Observabilidade: aviso no Telegram a cada carga. Token e chat vem do
      # .env (fora do versionamento); sem eles o envio e um no-op silencioso.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_NOTIFICAR=${TELEGRAM_NOTIFICAR:-tudo}
    volumes:
      - ./celery_app:/workspace/celery_app
      - ./notebooks:/workspace/notebooks
      # Conta de servico do Dremio: a mesma que o painel usa para consultar.
      - ./streamlit_test_jupyter/vars.env:/opt/painel/vars.env:ro
      - painel-estado:/estado
    # concurrency=1: as tarefas gravam nas mesmas tabelas Iceberg. Duas ao mesmo
    # tempo brigariam pelo commit no Nessie (e pela RAM do driver Spark).
    command: >
      celery -A celery_app.tarefas worker
      --loglevel=INFO --concurrency=1 --without-gossip --without-mingle
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nessie:
        condition: service_started
      dremio:
        condition: service_started
    networks: [interna]

  celery-beat:
    platform: linux/amd64
    build:
      context: ./docker/spark
    image: ${PROJETO}/spark-lakehouse:1.0
    container_name: ${PROJETO}_celery_beat
    restart: unless-stopped
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace:/workspace/notebooks
      - TZ=America/Fortaleza
      - CELERY_BROKER_URL=redis://redis:6379/0
      - HORA_ATUALIZACAO=${HORA_ATUALIZACAO:-07:00}
    volumes:
      - ./celery_app:/workspace/celery_app
      - painel-estado:/estado
    # O agendador so publica a mensagem na fila; quem executa e o worker.
    command: >
      celery -A celery_app.tarefas beat
      --loglevel=INFO --schedule=/estado/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    networks: [interna]

  minio:
    # Ultima release com o console administrativo completo. As posteriores
    # deixam so o navegador de objetos na edicao comunitaria.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${PROJETO}_minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DOMAIN=minio
      - MINIO_REGION_NAME=us-east-1
      - MINIO_REGION=us-east-1
      # Console atras do proxy TLS: o navegador e redirecionado para o subdominio.
      - MINIO_BROWSER_REDIRECT_URL=https://minio.${DOMAIN:-localhost}
      - ZONA_ENTRADA=${ZONA_ENTRADA}
      - ZONA_ARMAZEM=${ZONA_ARMAZEM}
      - ZONA_HISTORICO=${ZONA_HISTORICO}
    ports:
      - "127.0.0.1:9000:9000"    # API S3 (loopback)
      # console web (9001) sai pelo proxy: https://minio.${DOMAIN}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - minio-data:/data
      - ./seed/minio-data:/seed-entrada:ro
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address ':9001' &
      sleep 8;
      mc alias set local http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb -p local/$$ZONA_ENTRADA local/$$ZONA_ARMAZEM local/$$ZONA_HISTORICO;
      mc cp --recursive /seed-entrada/ local/$$ZONA_ENTRADA/ || true;
      wait"
    networks: [interna]

  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.4
    container_name: ${PROJETO}_nessie
    restart: unless-stopped
    environment:
      - QUARKUS_HTTP_PORT=19120
      - QUARKUS_LOG_LEVEL=INFO
      - NESSIE_VERSION_STORE_TYPE=ROCKSDB
      # /home/nessie e do usuario nessie (uid 10000); um volume nomeado herda esse
      # dono. Montar em /nessie cria diretorio de root e o servico morre com
      # "RocksDBException: While mkdir if missing: Permission denied".
      - NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH=/home/nessie/data
    ports:
      # Nessie nao tem autenticacao (auth NONE). Publicamos so em loopback: o
      # Dremio e o Spark o acessam por dentro da rede (nessie:19120); o host so
      # alcanca via localhost, nunca pela rede externa.
      - "127.0.0.1:19120:19120"
    volumes:
      - nessie-data:/home/nessie
    networks: [interna]

  postgres:
    image: postgres:17
    container_name: ${PROJETO}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed/postgres:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  mongo:
    image: mongo:7.0    # 8.x nao inicia em kernel >= 6.19 (SERVER-121912)
    container_name: ${PROJETO}_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./seed/mongo:/docker-entrypoint-initdb.d/:ro
    networks: [interna]

  # ---------------------------------------------------------------------------
  # Autenticacao do dashboard Streamlit (Supabase GoTrue + Postgres dedicado).
  # O app em streamlit_test_jupyter/ fala com supabase-auth:9999 pela rede interna.
  # ---------------------------------------------------------------------------
  supabase-db:
    image: postgres:15-alpine
    container_name: ${PROJETO}_supabase_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPABASE_DB_NAME:-supabase_auth}
      POSTGRES_USER: ${SUPABASE_DB_USER:-supabase_auth_admin}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:?configure SUPABASE_DB_PASSWORD no .env}
    volumes:
      - supabase-auth-data:/var/lib/postgresql/data
      - ./docker/supabase-init.sql:/docker-entrypoint-initdb.d/10-auth-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  supabase-auth:
    image: supabase/gotrue:v2.177.0
    container_name: ${PROJETO}_supabase_auth
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:9999}
      GOTRUE_SITE_URL: ${APP_PUBLIC_URL:-http://localhost:8502}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://${SUPABASE_DB_USER:-supabase_auth_admin}:${SUPABASE_DB_PASSWORD}@supabase-db:5432/${SUPABASE_DB_NAME:-supabase_auth}?sslmode=disable"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?configure JWT_SECRET no .env}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY_SECONDS:-3600}
      # Papel aceito como admin da Admin API (/admin/users). O app assina um JWT
      # service_role com o JWT_SECRET para o master criar/remover usuarios.
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: ${SUPABASE_DISABLE_SIGNUP:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${SUPABASE_MAILER_AUTOCONFIRM:-true}
    ports:
      # So loopback: o app fala com supabase-auth:9999 pela rede interna.
      - "127.0.0.1:${SUPABASE_AUTH_PORT:-9999}:9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [interna]

  # ---------------------------------------------------------------------------
  # Reverse proxy TLS. E o UNICO servico publicado na rede (80/443). As UIs HTTP
  # (dashboard, dremio, minio, jupyter) saem por ele, por subdominio de DOMAIN,
  # com certificado da CA interna do Caddy. Os demais servicos so publicam em
  # loopback (127.0.0.1) — a rede externa alcanca apenas o proxy.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: ${PROJETO}_caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [dremio, spark, minio, dashboard, api]
    networks: [interna]

volumes:
  painel-estado:
  dremio-data:
  minio-data:
  nessie-data:
  postgres-data:
  mongo-data:
  supabase-auth-data:
  caddy-data:
  caddy-config:

networks:
  interna:
